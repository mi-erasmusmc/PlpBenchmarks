url: https://mi-erasmusmc.github.io/PlpBenchmarks/

template:
  bootstrap: 5

navbar:
  structure:
    left: [home, intro, reference, articles, news]
    right: [search, github]
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
    intro:
      text: Get started
      href: articles/PlpBenchmarks.html

reference:
  - subtitle: View tasks
    desc: > 
     View pre-specified tasks for real-world data mapped to the OMOP-CDM and the Eunomia dataset.
    contents:
    - tasks
    - modelDesigns
    - eunomiaTasks
    - eunomiaDesigns
  - subtitle: Create a benchmark design
    desc: >
     Create a benchmark design and inspect it.
    contents:
    - createBenchmarkDesign
    - viewBenchmarkSettings
  - subtitle: Create cohorts, extract data
    desc: >
     Create cohorts on an OMOP-CDM instance and extract data from the CDM.
    contents:
    - createBenchmarkCohorts
    - extractBenchmarkData
  - subtitle: Run a benchmark
    desc: >
     Run the benchmark design and view results.
    contents:
    - runBenchmarkDesign
    - getBenchmarkModelPerformance
    - viewBenchmarkResults
  - subtitle: Other functions
    desc: >
     Other functions used to offer some extra functionalities but will soon be deprecated.
    contents:
    - createSampleTrainSetSettings
    - viewBenchmarkTasks
    - loadModelDesigns
